[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numba-jit-asan"
version = "0.1.0"
description = "Experimental real AddressSanitizer instrumentation for Numba CPU JIT code"
readme = "README.md"
requires-python = ">=3.10"
# Validated pairs only (see numba_jit_asan/toolchain.py); others are rejected at runtime.
dependencies = ["numba>=0.62.1,<0.69", "llvmlite>=0.45.1,<0.51"]

[project.optional-dependencies]
# Atheris 3.x imports only on Python >= 3.11 (it uses dis.Positions); 3.1.0 has
# no CPython 3.11 wheels.
fuzz = ['atheris==3.1.0; python_version >= "3.12"',
        'atheris==3.0.0; python_version == "3.11"',
        'atheris==2.3.0; python_version < "3.11"']

[project.scripts]
numba-asan = "numba_jit_asan.runner:main"

[tool.setuptools.packages.find]
include = ["numba_jit_asan*"]

[tool.setuptools.package-data]
numba_jit_asan = ["*.cpp", "*.c", "*.supp"]
