name: Sanitizer tests and distribution

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (Numba ${{ matrix.numba }}, ${{ matrix.dependencies }} NumPy/Numba)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dependencies: [stock, instrumented]
        # Validated pairs: the LLVM major must match the one llvmlite embeds.
        numba: ["0.62.1", "0.68.0"]
        include:
          - numba: "0.62.1"
            llvmlite: "0.45.1"
            llvm: 20
          - numba: "0.68.0"
            llvmlite: "0.50.0"
            llvm: 22
    env:
      EXPECT_INSTRUMENTED_DEPENDENCIES: ${{ matrix.dependencies == 'instrumented' && '1' || '0' }}
      EXPECT_FUZZER_DEPENDENCIES: ${{ matrix.dependencies == 'instrumented' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM and Python headers
        run: |
          if [ "${{ matrix.llvm }}" -gt 20 ]; then
            # Ubuntu 24.04 ships LLVM 20; newer releases come from apt.llvm.org.
            wget -qO llvm.sh https://apt.llvm.org/llvm.sh
            sudo bash llvm.sh ${{ matrix.llvm }}
          fi
          sudo apt-get update
          sudo apt-get install -y llvm-${{ matrix.llvm }}-dev clang-${{ matrix.llvm }} \
            libclang-rt-${{ matrix.llvm }}-dev python3-dev python3-venv
      - name: Use a sanitizer-compatible ASLR entropy
        # TSan/MSan shadow layouts reject the runner's 32-bit mmap randomization.
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Install package
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e ".[fuzz]" \
            "numba==${{ matrix.numba }}" "llvmlite==${{ matrix.llvmlite }}"
          .venv/bin/python -m pip check
      - name: Build native integration
        run: .venv/bin/numba-asan build
      - name: Rebuild NumPy and Numba with ASan and fuzzer coverage
        if: matrix.dependencies == 'instrumented'
        run: .venv/bin/numba-asan build-deps --fuzzer
      - name: Run real sanitizer regressions
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Build wheel
        if: matrix.dependencies == 'stock' && matrix.numba == '0.68.0'
        run: .venv/bin/python -m pip wheel --no-deps . -w dist
      - uses: actions/upload-artifact@v5
        if: matrix.dependencies == 'stock' && matrix.numba == '0.68.0'
        with:
          name: python-wheel
          path: dist/*.whl
          if-no-files-found: error
